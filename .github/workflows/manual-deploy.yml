name: Manual Deploy Projects

on:
  workflow_dispatch:
    inputs:
      deploy_portfolio:
        description: 'Deploy Portfolio'
        required: false
        default: false
        type: boolean
      deploy_blog:
        description: 'Deploy Blog'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force deploy even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  # Deploy Portfolio
  deploy-portfolio:
    if: ${{ inputs.deploy_portfolio }}
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configuration
        run: |
          if [ -z "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "❌ PERSONAL_ACCESS_TOKEN is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO }}" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_PORTFOLIO is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID_PORTFOLIO }}" ]; then
            echo "❌ FIREBASE_PROJECT_ID_PORTFOLIO is not configured"
            exit 1
          fi
          echo "✅ All required secrets are configured"
      
      - name: Checkout portfolio repository
        uses: actions/checkout@v4
        with:
          repository: makinox/portfolio
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Debug checkout
        run: |
          echo "Current directory: $(pwd)"
          echo "Repository contents:"
          ls -la
          echo "Package.json exists: $(test -f package.json && echo 'YES' || echo 'NO')"
          if [ -f package.json ]; then
            echo "Package.json content:"
            cat package.json | head -10
          fi

      - name: Check environment variables
        run: |
          echo "Checking for .env files:"
          ls -la | grep -E "\.env" || echo "No .env files found"
          echo ""
          echo "Checking for environment variables:"
          env | grep -E "(PUBLIC_|VITE_|ASTRO_)" || echo "No public env vars found"
          echo ""
          echo "Checking package.json for build scripts:"
          cat package.json | grep -A 5 -B 5 "scripts"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_PORTFOLIO }}

      - name: Notify deployment
        run: |
          echo "✅ Portfolio deployed successfully!"
          echo "🌐 Live at: https://jesusbossa.dev"

  # Deploy Blog
  deploy-blog:
    if: ${{ inputs.deploy_blog }}
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configuration
        run: |
          if [ -z "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "❌ PERSONAL_ACCESS_TOKEN is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOG }}" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_BLOG is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID_BLOG }}" ]; then
            echo "❌ FIREBASE_PROJECT_ID_BLOG is not configured"
            exit 1
          fi
          echo "✅ All required secrets are configured"
      
      - name: Checkout blog repository
        uses: actions/checkout@v4
        with:
          repository: makinox/blog-board
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Debug checkout
        run: |
          echo "Current directory: $(pwd)"
          echo "Repository contents:"
          ls -la
          echo "Package.json exists: $(test -f package.json && echo 'YES' || echo 'NO')"
          if [ -f package.json ]; then
            echo "Package.json content:"
            cat package.json | head -10
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOG }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_BLOG }}

      - name: Notify deployment
        run: |
          echo "✅ Blog deployed successfully!"
          echo "🌐 Live at: https://voib.jesusbossa.dev"

  # Summary job
  summary:
    needs: [deploy-portfolio, deploy-blog]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Manual Deployment Summary
        run: |
          echo "## 🚀 Manual Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Raw Input Values:**" >> $GITHUB_STEP_SUMMARY
          echo "- deploy_portfolio: '${{ inputs.deploy_portfolio }}'" >> $GITHUB_STEP_SUMMARY
          echo "- deploy_blog: '${{ inputs.deploy_blog }}'" >> $GITHUB_STEP_SUMMARY
          echo "- force_deploy: '${{ inputs.force_deploy }}'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Options Selected:**" >> $GITHUB_STEP_SUMMARY
          echo "- Portfolio: ${{ inputs.deploy_portfolio }}" >> $GITHUB_STEP_SUMMARY
          echo "- Blog: ${{ inputs.deploy_blog }}" >> $GITHUB_STEP_SUMMARY
          echo "- Force Deploy: ${{ inputs.force_deploy }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ inputs.deploy_portfolio }}" == "true" ]]; then
            if [[ "${{ needs.deploy-portfolio.result }}" == "success" ]]; then
              echo "✅ **Portfolio**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.deploy-portfolio.result }}" == "skipped" ]]; then
              echo "⚠️ **Portfolio**: Job skipped - check configuration" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Portfolio**: Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          if [[ "${{ inputs.deploy_blog }}" == "true" ]]; then
            if [[ "${{ needs.deploy-blog.result }}" == "success" ]]; then
              echo "✅ **Blog**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.deploy-blog.result }}" == "skipped" ]]; then
              echo "⚠️ **Blog**: Job skipped - check configuration" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Blog**: Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** Manual workflow dispatch" >> $GITHUB_STEP_SUMMARY
          
          # Debug information
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Debug Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- Portfolio result: ${{ needs.deploy-portfolio.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Blog result: ${{ needs.deploy-blog.result }}" >> $GITHUB_STEP_SUMMARY 